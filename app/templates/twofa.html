{% extends "auth_base.html" %}
{% block title %}Two-factor code{% endblock %}
{% block content %}
<div class="card">
  <h1>Enter your code</h1>
  <p class="muted">Open your authenticator app and enter the 6-digit code for YTMLS.</p>
  {% if error %}<p class="notice err">{{ error }}</p>{% endif %}
  <form method="post" action="/login/2fa" class="stack">
    <input type="hidden" name="csrf_token" value="{{ csrf }}">
    <label>Code <input name="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" required autofocus></label>
    <button class="primary">Verify</button>
  </form>
</div>
{% endblock %}
