services:
  ytmls:
    build: .
    image: ytmls:latest
    container_name: ytmls
    restart: unless-stopped
    # Match this to the user/group that owns your Jellyfin music folder.
    user: "1000:1000"
    environment:
      # "auto": cookies get the Secure flag whenever the request came in over
      # HTTPS (the tunnel), so plain-http LAN access keeps working too.
      # Set to "true" to refuse to work over plain http at all.
      YTMLS_COOKIE_SECURE: "auto"
      # Your tunnel address. Lets form posts through the tunnel pass the
      # same-site check even if the proxy rewrites the Host header.
      # YTMLS_PUBLIC_URL: https://music.example.com
      # Safe only when the app is reachable solely through the tunnel
      # (no published port, or one bound to 127.0.0.1 as below).
      YTMLS_TRUST_PROXY_HEADERS: "true"
      # Optional: keep the encryption key outside the data volume.
      # YTMLS_SECRET_KEY_FILE: /run/secrets/ytmls_key
    volumes:
      - ./data:/data
      # Point this at the folder Jellyfin uses for its music library.
      - /path/to/jellyfin/music:/music
    ports:
      # Bound to localhost so the only way in from outside is the tunnel.
      - "127.0.0.1:8080:8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
