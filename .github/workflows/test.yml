name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
      - run: docker build -t ytmls:ci .
      - name: Smoke-test the image's tools
        run: |
          docker run --rm --read-only --tmpfs /tmp --user 1000:1000 ytmls:ci sh -c \
            'ffmpeg -version | head -1 && deno --version | head -1 && python -c "import yt_dlp, mutagen; print(yt_dlp.version.__version__)"'

